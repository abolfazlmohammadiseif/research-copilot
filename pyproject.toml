[project]
name = "research-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abolfazl", email = "mohamadi.seif@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.0",
]

[project.scripts]
research-copilot = "research_copilot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

